<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AST Viewer</title>
		<link rel="stylesheet" href="main.css" />
	</head>
	<body>
		<div id="astBuilder">
			<h1>Build AST</h1>
			<textarea
				name="AST JSON"
				id="ASTInput"
				rows="25"
				cols="100"
			></textarea>
			<br />
			<button id="buildTree" type="button">View as tree</button>
			<button id="clear" type="button">Clear</button>
		</div>
		<h2>AST Tree</h2>
		<div id="ast-container">
			<ul>
				<li class="entry toggleable">
					<span class="value" id="program">Program</span>
					<span class="p">&#123;</span>
					<ul class="value-body">
						<li class="entry">
							<span class="key">
								<span class="name">kind</span>
								<span class="p">:&nbsp;</span>
							</span>
							<span class="value">
								<span class="s">"Program"</span>
							</span>
						</li>
					</ul>
					<span class="p">&#125;</span>
				</li>
			</ul>
		</div>
		<br />
		<br />
		<br />
		<script src="script.js"></script>
	</body>
</html>
